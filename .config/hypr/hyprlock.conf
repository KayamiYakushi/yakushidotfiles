# Yakushi · lock screen (hyprlock)
#
# Blurred desktop, the password pill in the middle with your Settings ->
# System picture above it, a big clock at the top and the song with its
# buttons at the bottom. $accent is rewritten by yakushi-themesync.py
# whenever the accent changes in Settings -> Appearance.

$accent = rgba(ffffffff)
$font   = JetBrainsMono Nerd Font
$ink    = rgba(e6e6e6ff)
$bright = rgba(f2f2f2ff)
$muted  = rgba(ffffff88)
$soft   = rgba(ffffffaa)
$button = rgba(ffffffcc)
$red    = rgba(ff5f6dff)
$song   = ~/.config/hypr/scripts/now-playing.sh
$player = playerctl --player=playerctld

general {
    ignore_empty_input = true
    hide_cursor = false
}

animations {
    enabled = true
    bezier = soft, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 4, soft
    animation = fadeOut, 1, 4, soft
    animation = inputFieldDots, 1, 2, soft
}

background {
    monitor =
    path = screenshot
    brightness = 0.55
    vibrancy = 0.15
    blur_size = 6
    blur_passes = 3
}

# ── middle: picture, password, keyboard layout ─────────────────────────

image {
    monitor =
    path = ~/.config/quickshell/assets/system-profile
    size = 96
    rounding = -1
    border_color = $accent
    border_size = 2
    halign = center
    valign = center
    position = 0, 90
}

input-field {
    monitor =
    size = 300, 50
    rounding = 25
    outline_thickness = 2
    outer_color = $accent
    inner_color = rgba(0a0a0ad9)
    check_color = $accent
    fail_color = $red
    font_family = $font
    font_color = $ink
    placeholder_text = <span foreground="##8a8a8a">Password</span>
    fail_text = <span foreground="##ff5f6d">$FAIL</span>
    fade_on_empty = false
    dots_center = true
    dots_size = 0.22
    dots_spacing = 0.35
    halign = center
    valign = center
    position = 0, -10
}

label {
    monitor =
    text = 󰌌  $LAYOUT
    onclick = hyprctl switchxkblayout all next
    font_family = $font
    font_size = 11
    color = $muted
    halign = center
    valign = center
    position = 0, -60
}

# ── top: clock and date ────────────────────────────────────────────────

label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 96
    color = $bright
    halign = center
    valign = top
    position = 0, -150
}

label {
    monitor =
    text = cmd[update:60000] date +"%A  ·  %d %B"
    font_family = $font
    font_size = 14
    color = $soft
    halign = center
    valign = top
    position = 0, -290
}

# ── bottom: the song and ⏮ ⏯ ⏭ (empty when nothing plays) ─────────────

label {
    monitor =
    text = cmd[update:1000] $song
    font_family = $font
    font_size = 13
    color = $ink
    halign = center
    valign = bottom
    position = 0, 120
}

label {
    monitor =
    text = cmd[update:2000] $song previous
    onclick = $player previous
    font_family = $font
    font_size = 20
    color = $button
    halign = center
    valign = bottom
    position = -56, 70
}

label {
    monitor =
    text = cmd[update:1000] $song pause
    onclick = $player play-pause
    font_family = $font
    font_size = 24
    color = $accent
    halign = center
    valign = bottom
    position = 0, 68
}

label {
    monitor =
    text = cmd[update:2000] $song next
    onclick = $player next
    font_family = $font
    font_size = 20
    color = $button
    halign = center
    valign = bottom
    position = 56, 70
}
