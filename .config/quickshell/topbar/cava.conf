; Audio spectrum for the island's now-playing visualizer.
; cava only runs while the visualizer is on screen (hovering the song, or
; always if chosen in Settings -> Top Bar) and something is playing.

[general]
bars = 6
framerate = 30
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[input]
method = pulse
source = auto

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 60
